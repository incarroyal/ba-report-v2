[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 루트("/") 요청 시 최신 파일(index_22.html)을 그대로 서빙 (force로 기존 index.html보다 우선)
[[redirects]]
  from = "/"
  to = "/index_22.html"
  status = 200
  force = true

# build v26.07.19-23

# HTML은 항상 최신으로 (캐시로 인한 구버전 사용 방지)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
